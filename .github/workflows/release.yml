name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build release binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: git-dashboard-tui
            asset_name: git-dashboard-tui-x86_64-unknown-linux-gnu.tar.gz
          # Built natively on an arm64 runner rather than cross-compiled, so
          # no cross linker is needed. These runners are free for public
          # repositories but are rejected in private ones — if this repo ever
          # goes private, switch this entry to a cross-compile from
          # ubuntu-latest with gcc-aarch64-linux-gnu.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact_name: git-dashboard-tui
            asset_name: git-dashboard-tui-aarch64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: git-dashboard-tui
            asset_name: git-dashboard-tui-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: git-dashboard-tui
            asset_name: git-dashboard-tui-aarch64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: git-dashboard-tui.exe
            asset_name: git-dashboard-tui-x86_64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.asset_name }} -C target/${{ matrix.target }}/release ${{ matrix.artifact_name }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          7z a ${{ matrix.asset_name }} target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
      # One checksum file per asset, merged into a single SHA256SUMS below.
      # install.sh verifies against it, so a tampered or truncated download is
      # refused rather than installed.
      - name: Checksum (Unix)
        if: runner.os != 'Windows'
        run: shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
      - name: Checksum (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset_name }}
      - name: Upload checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: sha256-${{ matrix.target }}
          path: ${{ matrix.asset_name }}.sha256

  checksums:
    name: Publish SHA256SUMS
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sha256-*
          merge-multiple: true
      - name: Combine
        run: cat ./*.sha256 | sort -k2 > SHA256SUMS && cat SHA256SUMS
      - name: Upload SHA256SUMS
        uses: softprops/action-gh-release@v3
        with:
          files: SHA256SUMS

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-24.04-arm covers the aarch64-unknown-linux-gnu release
        # target, so that binary is tested rather than only built. macOS
        # runners are already arm64, so Apple Silicon is covered by
        # macos-latest.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run Formatting Check
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Tests (Unit + Integration)
        run: cargo test --all-targets

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check generated pages, links, images and language parity
        run: python3 docs/check_docs.py
      - name: Test documentation gate failures
        run: python3 -m unittest discover -s docs -p 'test_check_docs.py'

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.88
      - name: Check locked dependencies and all targets on MSRV
        run: cargo check --locked --all-targets
